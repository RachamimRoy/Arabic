<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08a7fe">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="قوائم">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>قوائم</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>


<link rel="stylesheet" href="./styles.css">
</head>
<body class="app-booting">
<main class="wrap">
  <header class="top">
    <button id="menuButton" class="icon-button" type="button" title="תפריט" aria-label="תפריט"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
    <button id="settingsButton" class="icon-button" type="button" title="הגדרות" aria-label="הגדרות"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.5 1.5M16.5 16.5 18 18M18 6l-1.5 1.5M7.5 16.5 6 18"/></svg></button>
    <button id="headerHomeButton" class="icon-button header-home" type="button" title="חזרה למסך הבית" aria-label="חזרה למסך הבית" hidden><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
    <button id="listBack" class="icon-button header-home" type="button" title="חזרה" aria-label="חזרה" hidden><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
  </header>

  <section id="homePage" class="home-page">
    <div id="homeLoading" class="home-loading" role="status" aria-live="polite">
      <span class="home-loading-spinner" aria-hidden="true"></span>
      <span>טוען את השיעורים…</span>
    </div>
    <div class="continue-learning">
      <button id="continueLearningButton" class="primary continue-learning-button" type="button">המשך ללמוד</button>
      <p id="continueLearningMeta" class="muted continue-learning-meta"></p>
    </div>
    <h2 class="home-heading">השיעורים שלי</h2>
    <div id="lessonList" class="lesson-list"></div>
    <button id="allLessonsButton" class="primary all-lessons-button" type="button">כל המילים והתרגול המשולב</button>
  </section>

  <section id="lessonPage" class="lesson-page" hidden>
    <h2 id="lessonTitle" class="lesson-title"></h2>
    <div id="featuredCard" class="card home-feature" tabindex="0" aria-label="מילה מהשיעור. החליקו ימינה או שמאלה למעבר בין מילים">
      <button id="featuredAudio" class="audio-button" type="button" title="השמעת המילה והמשפט" aria-label="השמעת המילה ואז המשפט"></button>
      <div class="word-content"><div class="word-line"><h2 id="featuredWord" class="word"></h2><span id="featuredTranslit" class="translit"></span></div>
      <p id="featuredMeaning" class="word-meaning"></p><div id="featuredMeta" class="meta-tags"></div>
      <div class="example"><p id="featuredSentence" class="sentence"></p></div></div>
    </div>
    <div class="dashboard-list">
      <button class="dashboard-row" type="button" data-home-list="all"><span><strong>כל המילים</strong></span><span id="allRing" class="progress-ring"><b id="homeAllCount">0</b></span></button>
      <button class="dashboard-row" type="button" data-home-list="unseen"><span><strong>עוד לא למדתי</strong></span><span id="unseenRing" class="progress-ring"><b id="homeUnseenCount">0</b></span></button>
      <button class="dashboard-row" type="button" data-home-list="retry"><span><strong>מילים לחזרה</strong></span><span id="retryRing" class="progress-ring"><b id="homeRetryCount">0</b></span></button>
    </div>
    <button id="practiceButton" class="primary home-practice" type="button">תרגול השיעור</button>
  </section>

  <section id="quizPage" hidden>
    <div id="sessionProgress" class="session-progress"><span>טוען…</span></div>
    <div class="word-card-viewport"><div id="wordCard" class="card word-card">
      <div id="successPop" class="success-pop" hidden><div class="success-check"><svg class="status-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.2 4.2L19 7"/></svg></div></div>
      <button id="quizAudio" class="audio-button" type="button" title="השמעת המילה והמשפט" aria-label="השמעת המילה ואז המשפט"></button>
      <div class="word-content"><div class="word-line"><h2 id="arabicWord" class="word"></h2><span id="wordTranslit" class="translit"></span></div>
      <div id="meta" class="meta-tags"></div>
      <div class="example"><p id="arabicSentence" class="sentence"></p></div></div>
      <form id="form"><input id="word" aria-label="תרגום המילה" placeholder="תרגום המילה" autocomplete="off"><button id="checkButton" class="check" type="button">בדיקה</button><span id="keyboardSpacer" class="keyboard-spacer" aria-hidden="true"></span></form>
      <section id="feedback" class="feedback" hidden>
        <div id="wrongAnswerBox" class="answer-state wrong-answer"><span class="answer-icon"><svg class="status-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></span><div class="answer-content"><p id="mine"></p></div></div>
        <div class="answer-state correct-answer"><span class="answer-icon"><svg class="status-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.2 4.2L19 7"/></svg></span><div class="answer-content"><small>התשובה הנכונה</small><p id="correct"></p><p id="correctSentence" class="sentence-translation"></p></div></div>
        <p id="retryNotice" class="retry-notice">נוסף לרשימת המילים לחזרה</p>
      </section>
    </div></div>
    <div class="navigation"><button id="previousButton" class="nav-button" type="button">מילה קודמת</button><button id="nextButton" class="nav-button" type="button">דילוג</button></div>
  </section>

  <section id="summaryPage" class="card" hidden>
    <div class="summary-head"><div><p class="muted" style="margin:0 0 5px">הסט הסתיים</p><h2 style="margin:0">סיכום הסט</h2></div></div>
    <p id="summaryStats" class="summary-stats"></p><div id="summaryList" class="summary-list"></div>
    <div id="summaryActions" class="summary-actions">
      <button id="retryMistakesButton" class="nav-button summary-retry" type="button">חזרה על הטעויות</button>
      <button id="continueButton" class="nav-button summary-continue" type="button">לסט הבא</button>
    </div>
  </section>

  <section id="listPage" class="card" hidden>
    <div class="list-head"><h2 id="listTitle" style="margin:0"></h2></div><button id="listPractice" class="primary list-practice" type="button">תרגול הרשימה</button><div id="wordList" class="word-list"></div>
  </section>
</main>

<div id="drawerOverlay" class="drawer-overlay" hidden></div>
<aside id="drawer" class="drawer" hidden>
  <div class="drawer-head"><h2 style="margin:0">תפריט</h2><button id="closeMenu" class="icon-button" type="button" aria-label="סגירת התפריט"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
  <div class="menu-list">
    <button id="homeButton" class="menu-row" type="button"><span>מסך הבית</span><strong>⌂</strong></button>
    <button class="menu-row" data-list="all"><span>כל המילים</span><strong id="totalCount">0</strong></button>
    <button class="menu-row" data-list="known"><span>מילים שאני יודע</span><strong id="knownCount">0</strong></button>
    <button class="menu-row" data-list="unseen"><span>עוד לא למדתי</span><strong id="unseenCount">0</strong></button>
    <button class="menu-row" data-list="retry"><span>מילים לחזרה</span><strong id="retryCount">0</strong></button>
  </div>
</aside>

<aside id="settingsDrawer" class="drawer settings-drawer" hidden>
  <div class="drawer-head"><h2 style="margin:0">הגדרות</h2><button id="closeSettings" class="icon-button" type="button" aria-label="סגירת ההגדרות"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
  <div class="user-box"><div id="googleSignIn" class="google-login"></div><div id="googleProfile" class="google-profile" hidden><img id="googlePicture" alt=""><span class="google-profile-copy"><strong id="googleName"></strong><small id="googleEmail" class="muted"></small></span></div><button id="googleSignOut" class="google-signout" type="button" hidden>התנתקות מחשבון Google</button><div id="recoveryTools" hidden><div id="userCode"></div><button id="copyUserCode" type="button">העתקת קוד</button><button id="restoreUserCode" type="button">שחזור</button></div><div id="cloudStatus" class="cloud-status">מתחבר לשמירה בענן…</div></div>
  <div class="menu-list">
    <div class="direction-setting">
      <span class="direction-label">כיוון התרגול</span>
      <button id="directionToggleButton" class="setting-control direction-control" type="button" aria-label="החלפת כיוון התרגול"></button>
    </div>
    <div class="direction-setting">
      <span class="direction-label">ניגון אוטומטי</span>
      <button id="autoPlayButton" class="setting-control active" type="button" aria-label="ניגון אוטומטי: פעיל" aria-pressed="true"><svg class="setting-icon" viewBox="0 0 28 24" aria-hidden="true"><path d="M4 9h5l5-4v14l-5-4H4zM18 8c1.6 1.3 1.6 6.7 0 8M21 5c3.2 2.7 3.2 11.3 0 14"/></svg></button>
    </div>
    <button id="shuffleButton" class="menu-row setting-row active" type="button"><span>ערבוב מילים</span><strong class="menu-icon"></strong></button>
  </div>
  <button id="resetProgress" class="menu-row danger setting-row" type="button"><span>איפוס התקדמות</span><strong class="menu-icon"><svg class="setting-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 8a8 8 0 1 0 1 6M19 4v4h-4"/></svg></strong></button>
  <p id="appVersion" class="app-version">قوائم v20.2</p>
</aside>

<script src="./app.js" defer></script>
</body>
</html>
